// Weighted prize pool — drawn at PURCHASE TIME (predetermined), revealed later.
// Symbols: '7' = jackpot row, '★' = big, 'BAR' = mid, '🍒' = small. Misses pull from a non-matching pool.
const SYMBOL_POOL = ['7','★','BAR','🍒','♦','♣','♠','🔔'];
function drawPrize() {
  const r = Math.random();
  if (r < 0.0005) return { prize: 2500, symbols: ['7','7','7'],   label: 'JACKPOT' };
  if (r < 0.005)  return { prize: 250,  symbols: ['★','★','★'],   label: 'BIG WIN' };
  if (r < 0.03)   return { prize: 25,   symbols: ['BAR','BAR','BAR'], label: 'NICE HIT' };
  if (r < 0.12)   return { prize: 5,    symbols: ['🍒','🍒','🍒'], label: 'CHERRIES' };
  if (r < 0.30)   return { prize: 1,    symbols: ['🔔','🔔','♦'],  label: 'CONSOLATION' };
  // Loss — 3 non-matching random symbols
  const pick = () => SYMBOL_POOL[Math.floor(Math.random()*SYMBOL_POOL.length)];
  let a = pick(), b = pick(), c = pick();
  // ensure not 3-match
  if (a === b && b === c) c = SYMBOL_POOL.find(s => s !== a);
  return { prize: 0, symbols: [a,b,c], label: 'TRY AGAIN' };
}

/* ─────────────────────────────────────────────────────────────
   APP ROOT
   ───────────────────────────────────────────────────────────── */

function App() {
  // State
  const [view, setView] = useState('home');   // 'home' | 'freeEntries' | 'artists' | 'how'
  const [genre, setGenre] = useState('All');
  const [query, setQuery] = useState('');
  const [cart, setCart] = useState([]);                  // [{trackId, qty}]
  const [points, setPoints] = useState(125);             // sweeps points
  const [pendingEntries, setPendingEntries] = useState([]); // [{id, prize, symbols, label, source}]
  const [history, setHistory] = useState([]);              // revealed entries + purchases
  const [playing, setPlaying] = useState(null);             // current track id
  const [showCart, setShowCart] = useState(false);
  const [showAccount, setShowAccount] = useState(false);
  const [showReveal, setShowReveal] = useState(false);
  const [activeReveal, setActiveReveal] = useState(null);
  const [toast, setToast] = useState(null);

  // Seed a couple of pending entries so the demo has something to reveal
  useEffect(() => {
    const seeded = Array.from({length: 3}, (_,i) => ({ id: `seed-${i}`, ...drawPrize(), source: 'welcome bonus' }));
    setPendingEntries(seeded);
  }, []);

  // Toast helper
  const flash = useCallback((msg, tone='gold') => {
    setToast({ msg, tone, id: Date.now() });
    setTimeout(() => setToast(t => (t && t.msg===msg ? null : t)), 2400);
  }, []);

  const cartCount = cart.reduce((s,c) => s + c.qty, 0);
  const cartItems = cart.map(c => ({ ...c, track: TRACKS.find(t => t.id === c.trackId) }));
  const cartSubtotal = cartItems.reduce((s,i) => s + i.qty * i.track.price, 0);
  const cartEntries  = cartItems.reduce((s,i) => s + i.qty * i.track.entries, 0);

  const addToCart = useCallback((trackId) => {
    setCart(prev => {
      const found = prev.find(c => c.trackId === trackId);
      if (found) return prev.map(c => c.trackId===trackId ? {...c, qty: c.qty+1} : c);
      return [...prev, { trackId, qty: 1 }];
    });
    const t = TRACKS.find(x=>x.id===trackId);
    flash(`Added "${t.title}" — +${t.entries} entries on purchase`, 'gold');
  }, [flash]);

  const removeFromCart = useCallback((trackId) => {
    setCart(prev => prev.filter(c => c.trackId !== trackId));
  }, []);

  const completeCheckout = useCallback(() => {
    if (!cart.length) return;
    // Generate pre-determined entries for each entry granted
    const newEntries = [];
    cartItems.forEach(ci => {
      for (let i=0; i<ci.qty*ci.track.entries; i++) {
        newEntries.push({ id: `e-${Date.now()}-${Math.random().toString(36).slice(2,7)}-${i}`, ...drawPrize(), source: `${ci.track.title}` });
      }
    });
    setPendingEntries(prev => [...prev, ...newEntries]);
    setHistory(prev => [
      { type: 'purchase', when: Date.now(), tracks: cartItems.map(ci => ({...ci})), entries: cartEntries, total: cartSubtotal },
      ...prev
    ]);
    setCart([]);
    setShowCart(false);
    flash(`Purchase complete — ${cartEntries} entries added to your account`, 'win');
  }, [cart, cartItems, cartEntries, cartSubtotal, flash]);

  const revealNext = useCallback(() => {
    if (!pendingEntries.length) { flash('No entries to reveal — earn more or buy music', 'mute'); return; }
    setActiveReveal(pendingEntries[0]);
    setShowReveal(true);
  }, [pendingEntries, flash]);

  const finishReveal = useCallback((entry) => {
    setPendingEntries(prev => prev.slice(1));
    setHistory(prev => [{ type: 'reveal', when: Date.now(), ...entry }, ...prev]);
    if (entry.prize > 0) {
      setPoints(p => p + entry.prize);
      flash(`Won $${entry.prize} — added to your balance`, 'win');
      // Confetti
      if (window.confetti) {
        const dur = entry.prize >= 250 ? 2500 : 1200;
        const end = Date.now() + dur;
        (function frame() {
          window.confetti({ particleCount: 6, angle: 60, spread: 70, origin: { x: 0, y: 0.6 }, colors: ['#FFB627','#FFCC4D','#E53E3E','#FFFFFF'] });
          window.confetti({ particleCount: 6, angle: 120, spread: 70, origin: { x: 1, y: 0.6 }, colors: ['#FFB627','#FFCC4D','#E53E3E','#FFFFFF'] });
          if (Date.now() < end) requestAnimationFrame(frame);
        })();
      }
    }
  }, [flash]);

  const closeReveal = useCallback(() => {
    setShowReveal(false);
    setActiveReveal(null);
  }, []);

  const claimFreeEntry = useCallback(() => {
    const entry = { id: `free-${Date.now()}`, ...drawPrize(), source: 'free entry — no purchase' };
    setPendingEntries(prev => [...prev, entry]);
    flash('Free entry added — reveal it from your account', 'gold');
  }, [flash]);

  const currentTrack = TRACKS.find(t => t.id === playing) || null;

  return (
    <div className="bg-stage min-h-screen pb-32">
      <TopNav
        cartCount={cartCount}
        pending={pendingEntries.length}
        points={points}
        view={view}
        onView={setView}
        onCart={() => setShowCart(true)}
        onAccount={() => setShowAccount(true)}
        onReveal={revealNext}
      />

      {view === 'home' && (
        <>
          <Ticker history={history} />
          <ActionBar
            onSubscribe={() => flash('Membership signup coming soon — Wallet Pack, Songs Pack, Game Pack tiers', 'gold')}
            onScout={() => flash('Talent Scout Program — refer artists and fans, earn commissions. Signup coming soon.', 'gold')}
          />
          <Hero pending={pendingEntries.length} points={points} onReveal={revealNext} onBrowse={()=>{const el=document.getElementById('catalog'); el && el.scrollIntoView({behavior:'smooth'});}} onFree={()=>setView('freeEntries')} />
          <Catalog
            genre={genre} onGenre={setGenre}
            query={query} onQuery={setQuery}
            playing={playing} onPlay={setPlaying}
            onAdd={addToCart}
          />
          <MusicPacks
            onAdd={(pack) => flash(`Added ${pack.size}-song Music Pack — $${pack.price} · +${pack.credits.toLocaleString()} credits`, 'gold')}
          />
          <SurpriseBuckets
            onAdd={(b) => flash(`Added ${b.size}-song Surprise Bucket — $${b.price} · +${b.credits.toLocaleString()} credits`, 'gold')}
          />
          <ConcertAnnouncements
            onSubscribe={() => flash('Membership signup coming soon — Wallet Pack, Songs Pack, Game Pack tiers', 'gold')}
          />
          <HowItWorks onFree={()=>setView('freeEntries')} />
        </>
      )}

      {view === 'freeEntries' && (
        <FreeEntriesPage onBack={()=>setView('home')} onClaim={claimFreeEntry} />
      )}

      {view === 'artists' && <ArtistsPage onBack={()=>setView('home')} />}

      {view === 'how' && <HowPage onBack={()=>setView('home')} onFree={()=>setView('freeEntries')} />}

      <Footer onView={setView} />

      {/* Now playing */}
      {currentTrack && <NowPlaying track={currentTrack} onClose={()=>setPlaying(null)} />}

      {/* Floating reveal-entries badge */}
      {pendingEntries.length > 0 && view==='home' && (
        <button
          onClick={revealNext}
          className="fixed left-1/2 -translate-x-1/2 bottom-24 z-30 px-5 py-3 rounded-full bg-gradient-to-r from-flame to-gold shadow-[0_10px_30px_-5px_rgba(229,62,62,0.6)] btn-press flex items-center gap-2 font-semibold"
        >
          <Icon.gift size={18}/>
          {pendingEntries.length} {pendingEntries.length===1?'entry':'entries'} to reveal
          <Icon.arrow size={16}/>
        </button>
      )}

      {showCart && (
        <CartDrawer
          items={cartItems}
          subtotal={cartSubtotal}
          totalEntries={cartEntries}
          onClose={()=>setShowCart(false)}
          onRemove={removeFromCart}
          onCheckout={completeCheckout}
        />
      )}

      {showAccount && (
        <AccountDrawer
          points={points}
          pending={pendingEntries}
          history={history}
          onClose={()=>setShowAccount(false)}
          onReveal={revealNext}
        />
      )}

      {showReveal && activeReveal && (
        <RevealModal
          entry={activeReveal}
          onFinish={finishReveal}
          onClose={closeReveal}
        />
      )}

      {toast && <Toast {...toast} />}
    </div>
  );
}

  const loop = [...items, ...items, ...items, ...items];

function NowPlaying({ track, onClose }) {

    return () => clearInterval(id);

  return (
    <div className="fixed left-0 right-0 bottom-0 z-30 pb-safe border-t border-white/10 bg-ink/85 backdrop-blur-xl">
      <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-3">

          <div className="h-1 bg-white/10 rounded-full mt-1.5 overflow-hidden">
            <div className="h-full bg-gradient-to-r from-gold to-flame transition-all" style={{ width: `${progress}%` }}/>
          </div>
        </div>
        <div className="hidden sm:flex items-center gap-2 text-mute text-xs tabular-nums w-24 justify-end">
          {(() => {
            const [m, s] = track.duration.split(':').map(Number);

            const cur = Math.floor(totalSec * progress / 100);

            return `${cm}:${cs.toString().padStart(2,'0')} / ${track.duration}`;
          })()}
        </div>
        <button onClick={onClose} className="p-2 rounded-full hover:bg-white/5" aria-label="Stop">
          <Icon.x size={18}/>
        </button>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   REVEAL MODAL — the slot machine
   ───────────────────────────────────────────────────────────── */

function RevealModal({ entry, onFinish, onClose }) {
  const [stage, setStage] = useState('ready'); // ready | spinning | revealed
  const [reels, setReels] = useState(['?','?','?']);
  const [tick, setTick] = useState(0); // cycles symbols during spin
  const stoppedRef = useRef([false,false,false]);

  // Cycle symbols every 90ms while any reel is still spinning
  useEffect(() => {
    if (stage !== 'spinning') return;
    const id = setInterval(() => setTick(t => t + 1), 90);
    return () => clearInterval(id);
  }, [stage]);

  const reveal = () => {
    if (stage !== 'ready') return;
    stoppedRef.current = [false,false,false];
    setStage('spinning');
    // Stagger reel stops to feel like a real slot
    [0,1,2].forEach((i) => {
      setTimeout(() => {
        setReels(prev => {
          const next = [...prev];
          next[i] = entry.symbols[i];
          return next;
        });
        stoppedRef.current[i] = true;
        if (i===2) {
          setTimeout(() => {
            setStage('revealed');
            onFinish(entry);
          }, 500);
        }
      }, 900 + i * 700);
    });
  };

  const tone = entry.prize >= 250 ? 'jackpot' : entry.prize > 0 ? 'win' : 'lose';

  return (
    <div className="fixed inset-0 z-50 modal-back bg-ink/80 grid place-items-center p-4 overflow-y-auto" onClick={stage==='revealed' ? onClose : null}>
      <div className="relative w-full max-w-md" onClick={e=>e.stopPropagation()}>
        <div className={`rounded-3xl overflow-hidden border ${tone==='jackpot' ? 'border-gold win-pulse' : tone==='win' ? 'border-win/50' : 'border-white/10'} bg-gradient-to-b from-ink-card to-ink-surface shadow-2xl`}>
          {/* Top bar */}
          <div className="flex items-center justify-between px-5 py-3 border-b border-white/10">
            <div className="flex items-center gap-2 text-sm text-mute">
              <Icon.ticket size={14}/> Entry from <span className="text-slate-200">{entry.source}</span>
            </div>
            {stage==='revealed' && (
              <button onClick={onClose} className="p-1.5 rounded-full hover:bg-white/5"><Icon.x size={16}/></button>
            )}
          </div>

          {/* Reels */}
          <div className="p-6 sm:p-8">
            <div className="grid grid-cols-3 gap-3">
              {reels.map((s, i) => (
                <div key={i} className={`aspect-[3/4] rounded-2xl border-2 ${tone==='jackpot' && stage==='revealed' ? 'border-gold' : 'border-white/10'} bg-gradient-to-b from-ink to-ink-surface relative overflow-hidden`}>
                  <div className={`absolute inset-0 grid place-items-center font-display text-6xl sm:text-7xl ${tone==='jackpot' && stage==='revealed' ? 'text-gold' : tone==='win' && stage==='revealed' ? 'text-win' : 'text-slate-100'} ${stage==='spinning' && !stoppedRef.current[i] ? 'blur-[2px]' : ''}`}>
                    {stage==='spinning' && !stoppedRef.current[i]
                      ? SYMBOL_POOL[(tick + i*3) % SYMBOL_POOL.length]
                      : s}
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-6 min-h-[80px] text-center">
              {stage==='ready' && (
                <>
                  <div className="text-sm text-mute mb-3">Your result is already decided. Tap to reveal it.</div>
                  <GoldButton size="lg" className="w-full" onClick={reveal}>
                    <span className="inline-flex items-center gap-2"><Icon.zap size={18}/> Reveal</span>
                  </GoldButton>
                </>
              )}
              {stage==='spinning' && (
                <div className="text-mute text-sm py-4">Revealing…</div>
              )}
              {stage==='revealed' && (
                <>
                  <div className={`font-display tracking-wider text-2xl mb-1 ${tone==='jackpot'?'text-gold':tone==='win'?'text-win':'text-mute'}`}>{entry.label}</div>
                  {entry.prize > 0 ? (
                    <>
                      <div className={`font-display text-6xl ${tone==='jackpot'?'text-gold':'text-win'}`}>
                        ${entry.prize}
                      </div>
                      <div className="text-mute text-sm mt-2">Added to your Lucky7 balance</div>
                    </>
                  ) : (
                    <div className="text-mute text-base mt-2">No prize on this entry. More entries waiting?</div>
                  )}
                  <GhostButton size="md" className="w-full mt-5" onClick={onClose}>Done</GhostButton>
                </>
              )}
            </div>
          </div>

          <div className="px-5 py-3 border-t border-white/10 text-center text-[11px] text-dim">
            Entries are pre-determined at purchase or claim. See official rules.
          </div>
        </div>
      </div>
    </div>
  );
}

  const colors = {
    gold: 'border-gold/40 bg-gold/10 text-gold',
    win:  'border-win/40 bg-win/10 text-win',
    flame:'border-flame/40 bg-flame/10 text-flame',
    mute: 'border-white/15 bg-white/5 text-slate-100',
  };
  return (
    <div className={`fixed left-1/2 -translate-x-1/2 bottom-32 z-50 px-4 py-2.5 rounded-full border backdrop-blur-md text-sm font-medium shadow-xl ${colors[tone]||colors.gold}`}>
      {msg}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   MOUNT
   ───────────────────────────────────────────────────────────── */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
